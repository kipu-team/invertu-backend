spring.application.name=invertu-backend

# Las claves no van en el codigo: se leen de variables de entorno.
# En local se cargan desde el archivo .env (copiar .env.example y completar).
spring.config.import=optional:file:.env[.properties]

# Base de datos (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_invertu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# update: crea o ajusta las tablas sin borrar los datos al reiniciar
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Errores: no se envian detalles internos al cliente
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Zona horaria de las fechas en JSON
spring.jackson.time-zone=America/Lima

# Frontend (Angular) permitido por CORS
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiracion-segundos=${JWT_EXPIRACION_SEGUNDOS:3600}

# Correo (SMTP). Con Gmail se usa una contrasena de aplicacion.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# IA (chatbot y lectura de comprobantes)
ia.api-key=${IA_API_KEY:}

# Comprobantes: carpeta local ahora; S3 en el despliegue
almacenamiento.ruta=${ALMACENAMIENTO_RUTA:comprobantes}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Comprobantes (END-TRX-03): hasta 5 MB por archivo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Claude (lectura de comprobantes, END-TRX-03)
anthropic.api-key=${ANTHROPIC_API_KEY:}